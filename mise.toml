[tools]
bun = "1.3.14"
clang = "latest"
"conda:libclang" = "22.1.8"
mold = "latest"
rust = "1.96.0"

[env]
LIBCLANG_PATH = "{{env.HOME}}/.local/share/mise/installs/conda-libclang/22.1.8/lib"

[tasks.setup]
description = "プロジェクトのセットアップ (submodule 初期化 + 依存インストール)"
run = [
  "git submodule update --init --recursive",
  "bun install",
]

[tasks.dev]
description = "デスクトップアプリを起動"
run = "bun tauri dev"

[tasks."dev:web"]
description = "フロントエンドだけ起動 (port 1420)"
run = "bun dev"

[tasks.build]
description = "フロントエンドのみビルド"
run = "bun run build"

[tasks."build:core-tools"]
description = "Docker で tools/core の tooth-backend を静的リンクビルドし src-tauri/binaries/ に配置"
run = "docker buildx build -f docker/Dockerfile.core-tools --target export --output type=local,dest=src-tauri/binaries/ . && mv src-tauri/binaries/tooth-backend src-tauri/binaries/tooth-backend-$(rustc --print host-tuple)"

[tasks."build:all"]
description = "サイドカー + デスクトップアプリをビルド"
depends = ["build:core-tools"]
run = "bun tauri build"

[tasks.type]
description = "型検査"
run = "bun type"

[tasks.lint]
description = "リント・フォーマット修正"
run = "bun check"

[tasks."check-rs"]
description = "Rust 側の検証 (src-tauri/)"
dir = "src-tauri"
run = [
  "cargo fmt --all",
  "cargo clippy",
]

[tasks."check-ts"]
description = "TypeScript 側の検証"
run = [
  "bun check",
  "bun type",
]

[tasks."check:core-tools"]
description = "tools/core のビルド検証 (Docker ビルドで実施)"
depends = ["build:core-tools"]
run = "echo 'core-tools check is bundled into build:core-tools (Docker build)'"

[tasks.check]
description = "全体チェック (Rust + TypeScript + core-tools)"
depends = [
  "check-rs",
  "check-ts",
  "check:core-tools",
]

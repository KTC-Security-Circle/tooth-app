[tools]
bun = "1.3.14"
clang = "latest"
mold = "latest"
rust = "1.96.0"

[tasks."check-rs"]
dir = "src-tauri"
run = [
  "cargo fmt",
  "cargo clippy",
]

[tasks."check-ts"]
run = [
  "bun check",
  "bun type",
]

[tasks.check]
description = "Run all checks"
depends = [
  "check-rs",
  "check-ts",
]
